hostname = ios-api-*.duolingo.com, ios-api-*.duolingo.cn, api*.duolingo.com, api*.duolingo.cn, stories.duolingo.com, stories.duolingo.cn

# > Duolingo Max 解锁（2026.10.15）
# 改自 Takagivegeta 的 Loon 插件 lingoDuo-enchanced.plugin
# https://github.com/TAKAGIVEGETA/MyScripts/tree/main/lingoDuo
# 帖子原文思路（含 QX 注意事项）：https://linux.do/t/topic/1449099
#
# 说明：
# - 脚本逻辑与作者帖子里的「Loon/Quanx/ShadowRK 脚本」一致，JS 已托管在本仓库。
# - 限时挑战时长、直接通关两条规则在原插件里默认关闭，这里保持注释状态，
#   需要时去掉行首的 # 启用（挑战时长在对应 JS 顶部 TIMER_MINS 改）。
# - 如部分课程没生效，可尝试在 QX 里开启「HTTP 抓取」（作者提示：开启后容易闪退）。
# - QX 有响应体积内存限制：batch 接口返回 10MB+ 时可能直接跳过脚本执行，
#   QX 不支持 Surge 那种 max-size 参数，此问题暂无解（可尝试降级多邻国旧版本）。

# 解锁 Max（无限体力、去广告、解锁视频通话等）
^https?:\/\/(ios-api-[a-z0-9-]+|api\d+)\.duolingo\.c(n|om)\/2023-05-23\/(batch|users\/[^\/?#]+)(?:[?#]|$) url script-response-body https://raw.githubusercontent.com/FlechazoPh/QuantumultX-1/main/JavaScript/Duolingo/Duolingo-Max.js

# 限时挑战时长修改（时长在 JS 顶部 TIMER_MINS 改，默认 60 分钟）
#^https?:\/\/(?:ios-api-[a-z0-9-]+|api\d+)\.duolingo\.c(?:n|om)\/.*\/live-ops-challenges url script-response-body https://raw.githubusercontent.com/FlechazoPh/QuantumultX-1/main/JavaScript/Duolingo/Duolingo-TimeModifier.js

# 直接通关（部分关卡）
#^https?:\/\/(?:ios-api-[a-z0-9-]+|api\d+|stories)\.duolingo\.c(?:n|om)\/(?:.*\/sessions|api2\/stories) url script-response-body https://raw.githubusercontent.com/FlechazoPh/QuantumultX-1/main/JavaScript/Duolingo/Duolingo-InstantClear.js
